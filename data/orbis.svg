<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- orbis: a planet with its orbit, in the window's accent violet. -->
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2540"/>
      <stop offset="1" stop-color="#141419"/>
    </linearGradient>
    <radialGradient id="planet" cx="0.38" cy="0.34" r="0.75">
      <stop offset="0" stop-color="#ede9fe"/>
      <stop offset="0.45" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#5b21b6"/>
    </radialGradient>
  </defs>
  <rect x="3" y="3" width="58" height="58" rx="14" fill="url(#ground)"/>
  <g transform="rotate(-24 32 32)">
    <!-- The back half of the orbit, behind the planet. -->
    <path d="M 8 32 A 24 8.5 0 0 1 56 32" fill="none" stroke="#a78bfa" stroke-opacity="0.45" stroke-width="2.5"/>
  </g>
  <circle cx="32" cy="32" r="13" fill="url(#planet)"/>
  <path d="M 28.5 25.5 L 39 32 L 28.5 38.5 Z" fill="#141419" fill-opacity="0.85"/>
  <g transform="rotate(-24 32 32)">
    <!-- The front half, over it, with a moon. -->
    <path d="M 56 32 A 24 8.5 0 0 1 8 32" fill="none" stroke="#c4b5fd" stroke-width="2.5"/>
    <circle cx="49" cy="38.2" r="3.4" fill="#f5d0fe"/>
  </g>
</svg>
