<svg xmlns="http://www.w3.org/2000/svg" width="820" height="468" viewBox="0 0 820 468" role="img" aria-labelledby="t d">
<title id="t">orbis and YouTube Music in Chrome: memory and CPU while playing</title>
<desc id="d">Memory (PSS): orbis with the window open uses 165 MB with 5 tabs and 204 MB with 11; a YouTube Music tab in Chrome uses 317 MB at the start and 472 MB an hour later. CPU with the window visible: orbis 0.65 to 0.9 percent of one core, the YouTube Music tab 16.2 percent.</desc>
<style>
  .bg { fill: #fcfcfb; }
  .h1 { font: 600 17px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #0b0b0b; }
  .h2 { font: 600 14px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #0b0b0b; }
  .sub, .legend, .label { font: 13px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #52514e; }
  .legend { fill: #0b0b0b; }
  .value { font: 600 13px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #0b0b0b; font-variant-numeric: tabular-nums; }
  .tick { font: 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #898781; font-variant-numeric: tabular-nums; }
  .grid { stroke: #e1e0d9; stroke-width: 1; }
  .axis { stroke: #c3c2b7; stroke-width: 1; }
  .s1 { fill: #2a78d6; }
  .s2 { fill: #eb6834; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #1a1a19; }
    .h1, .h2, .legend, .value { fill: #f0efec; }
    .sub, .label { fill: #c3c2b7; }
    .grid { stroke: #2c2c2a; }
    .axis { stroke: #383835; }
    .s1 { fill: #3987e5; }
    .s2 { fill: #d95926; }
  }
</style>
