[package]
name = "desktop"
description = "Desktop integration: MPRIS, tray, secret storage, window blur"
version.workspace = true
license.workspace = true
repository.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
aes = "0.9"
cbc = "0.2"
futures-util = { version = "0.3", default-features = false }
libc = "0.2"
oo7 = { version = "0.7", default-features = false, features = ["tokio", "native_crypto"] }
pbkdf2 = { version = "0.13", features = ["hmac"] }
rusqlite = { version = "0.43", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.11"
sha2 = "0.11"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "process", "rt", "sync"] }
zbus = { version = "6", default-features = false, features = ["tokio"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time"] }
