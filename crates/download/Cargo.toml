[package]
name = "download"
description = "Downloads tracks and writes their tags"
version.workspace = true
license.workspace = true
repository.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
lofty = "0.25"
reqwest = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
stream = { version = "0.1.0", path = "../stream" }
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "process", "rt", "time"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "time"] }
