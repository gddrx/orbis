[package]
name = "orbis"
description = "The orbis player: Qt Quick UI over the Rust core"
version.workspace = true
license.workspace = true
repository.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
desktop = { version = "0.1.0", path = "../desktop" }
image = { version = "0.25", default-features = false, features = ["png"] }
libc = "0.2"
orbis-core = { version = "0.1.0", path = "../core" }
player = { version = "0.1.0", path = "../player" }
qtbridge = { version = "0.4.1", features = ["serde_json"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
ytm = { version = "0.1.0", path = "../ytm" }

[build-dependencies]
cc = "1"
pkg-config = "0.3"
