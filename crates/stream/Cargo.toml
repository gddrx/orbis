[package]
name = "stream"
description = "Resolves a track to a playable audio stream URL"
version.workspace = true
license.workspace = true
repository.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
rusqlite = { version = "0.43", features = ["bundled"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "process", "sync", "time", "rt", "macros"] }
