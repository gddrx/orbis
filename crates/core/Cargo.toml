[package]
name = "orbis-core"
description = "The orbis core shared by the app and orbis-cli: the session and playback services"
version.workspace = true
license.workspace = true
repository.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
desktop = { version = "0.1.0", path = "../desktop" }
download = { version = "0.1.0", path = "../download" }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
player = { version = "0.1.0", path = "../player" }
reqwest = "0.13"
rusqlite = { version = "0.43", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.11"
stream = { version = "0.1.0", path = "../stream" }
thiserror = "2"
tokio = { version = "1", features = ["sync", "rt", "macros", "time"] }
toml = "0.9"
ytm = { version = "0.1.0", path = "../ytm" }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread"] }
